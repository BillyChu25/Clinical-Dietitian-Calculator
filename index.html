<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Food Exchange Planner</title>
    <!-- Manifest for PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FoodPlanner" />
    <meta name="application-name" content="Food Exchange Planner" />
    <!-- Theme color for address bar -->
    <meta name="theme-color" content="#2196f3" />
    <link rel="apple-touch-icon" href="images/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="images/icon-512.png" />
    <!-- External stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Food Exchange Planner</h1>
      <p>Select foods for each daypart and track your macros.</p>
    </header>
    <main>
      <div class="template-buttons">
        <button id="template1200">1200kcal</button>
        <button id="template1400">1400kcal</button>
        <button id="template1800">1800kcal</button>
      </div>
      <button id="addRowBtn">Add Item</button>
      <table id="planTable">
        <thead>
          <tr>
            <th>Daypart</th>
            <th>Macro</th>
            <th>Choice</th>
            <th>Portion</th>
            <th>Energy (kcal)</th>
            <th>Protein (g)</th>
            <th>Fat (g)</th>
          </tr>
        </thead>
        <tbody id="planBody"></tbody>
        <tfoot>
          <tr class="totals-row">
            <td colspan="4" data-label="Total">TOTAL</td>
            <td data-label="Energy (kcal)" id="totalEnergy">0</td>
            <td data-label="Protein (g)" id="totalProtein">0</td>
            <td data-label="Fat (g)" id="totalFat">0</td>
          </tr>
        </tfoot>
      </table>
    </main>
    <!-- Main application script -->
    <script src="app.js"></script>
  </body>
</html>
